<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>나만의 AI · 온라인 작업실</title><link rel="stylesheet" href="./site.css"><script src="./app.js" defer></script></head><body><main><header><span>MY AI · ONLINE</span><h1>나만의 온라인 작업실</h1><p>사진 속 장면을 설명하거나, 텍스트로 질문할 수 있어요.</p></header><section class="card"><div class="mode"><button id="photoMode" type="button" aria-pressed="true">사진 질문</button><button id="textMode" type="button" aria-pressed="false">텍스트 질문</button></div><div id="photoBox"><label for="photo">사진 선택</label><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"><img id="preview" alt="선택한 사진" hidden><p class="small">JPG·PNG·WebP, 최대 15MB. 사진은 이 브라우저 안에서만 처리해요.</p></div><label for="question">질문</label><textarea id="question" rows="3" maxlength="480" placeholder="예: 사진에 무엇이 보여?"></textarea><p id="modeNote" class="small">사진 모델은 영어 질문이 더 안정적입니다. 예: What objects are visible?</p><div class="actions"><button id="run" class="primary" type="button">답변 받기</button><button id="stop" type="button" hidden>중지</button></div><p id="status" role="status" class="small">처음 실행할 때 모델 파일 수백 MB를 내려받습니다.</p></section><section class="card" id="result" hidden><h2>AI 답변</h2><article id="answer"></article></section><footer>모델 다운로드에는 인터넷이 필요해요. 답변에는 오류가 있을 수 있습니다. 이 웹 버전은 PC를 원격 조작하지 않습니다.</footer></main></body></html>
